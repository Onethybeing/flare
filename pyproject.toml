[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgroups"
version = "1.0.0"
description = "Leakage-safe, case-level review queues for illicit-flow detection on transaction graphs (Elliptic++ study)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sourav Choudhary" }]
keywords = ["anti-money laundering", "graph neural networks", "Elliptic++", "Bitcoin", "fraud detection", "LightGBM"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "networkx>=3.0"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
experiments = ["torch>=2.0", "lightgbm>=4.0", "scikit-learn>=1.3", "matplotlib>=3.7", "kaggle>=1.6"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/Onethybeing/elliptic-flowgroups"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
